<svg width="100%" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Annur Official</title>
  <desc id="d">Aplikasi manajemen keuangan asrama: iuran bulanan, kas, dan status hutang anggota. Dibangun dengan TanStack Start, Neon Postgres, Drizzle, dan Better Auth.</desc>

  <!-- canvas: warm cream -->
  <rect x="0" y="0" width="1200" height="400" rx="28" fill="#f2f0eb"/>

  <!-- brand row -->
  <circle cx="98" cy="78" r="30" fill="#006241"/>
  <circle cx="98" cy="78" r="30" fill="none" stroke="#cba258" stroke-width="2.5"/>
  <text x="98" y="89" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">A</text>
  <text x="146" y="88" fill="#006241" font-size="30" font-weight="800" letter-spacing="-0.5">Annur Official</text>
  <rect x="392" y="64" width="58" height="30" rx="15" fill="#cba258"/>
  <text x="421" y="85" text-anchor="middle" fill="#1E3932" font-size="18" font-weight="700">v2</text>

  <!-- headline -->
  <text x="72" y="188" fill="#006241" font-size="46" font-weight="800" letter-spacing="-1">Keuangan asrama,</text>
  <text x="72" y="242" fill="#006241" font-size="46" font-weight="800" letter-spacing="-1">rapi dan transparan.</text>

  <!-- subline -->
  <text x="72" y="290" fill="#57534e" font-size="21" font-weight="400">Iuran bulanan, kas masuk &amp; keluar, dan status hutang</text>
  <text x="72" y="318" fill="#57534e" font-size="21" font-weight="400">tiap anggota, dalam satu aplikasi.</text>

  <!-- stack chips -->
  <g font-size="19" font-weight="600">
    <rect x="72" y="342" width="160" height="34" rx="17" fill="#ffffff" stroke="#dcd8d0"/>
    <text x="152" y="365" text-anchor="middle" fill="#1E3932">TanStack Start</text>
    <rect x="244" y="342" width="158" height="34" rx="17" fill="#ffffff" stroke="#dcd8d0"/>
    <text x="323" y="365" text-anchor="middle" fill="#1E3932">Neon Postgres</text>
    <rect x="414" y="342" width="104" height="34" rx="17" fill="#ffffff" stroke="#dcd8d0"/>
    <text x="466" y="365" text-anchor="middle" fill="#1E3932">Drizzle</text>
    <rect x="530" y="342" width="140" height="34" rx="17" fill="#ffffff" stroke="#dcd8d0"/>
    <text x="600" y="365" text-anchor="middle" fill="#1E3932">Better Auth</text>
  </g>

  <!-- right: status card (House Green) -->
  <rect x="724" y="40" width="404" height="320" rx="20" fill="#1E3932"/>
  <text x="752" y="88" fill="#ffffff" font-size="22" font-weight="700">Status Iuran &#183; Juli 2026</text>

  <!-- rows -->
  <text x="752" y="141" fill="#ffffff" font-size="21" font-weight="500">Rosi</text>
  <rect x="996" y="118" width="112" height="34" rx="17" fill="#d4e9e2"/>
  <text x="1052" y="141" text-anchor="middle" fill="#006241" font-size="18" font-weight="700">Lunas</text>

  <text x="752" y="185" fill="#ffffff" font-size="21" font-weight="500">Budi</text>
  <rect x="996" y="162" width="112" height="34" rx="17" fill="#d4e9e2"/>
  <text x="1052" y="185" text-anchor="middle" fill="#006241" font-size="18" font-weight="700">Lunas</text>

  <text x="752" y="229" fill="#ffffff" font-size="21" font-weight="500">Ari</text>
  <rect x="980" y="206" width="128" height="34" rx="17" fill="#f8d7d2"/>
  <text x="1044" y="229" text-anchor="middle" fill="#c82014" font-size="18" font-weight="700">- Rp 70.000</text>

  <!-- divider -->
  <line x1="752" y1="262" x2="1108" y2="262" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- saldo -->
  <text x="752" y="298" fill="#ffffff" fill-opacity="0.7" font-size="20" font-weight="500">Saldo Kas</text>
  <text x="752" y="336" fill="#cba258" font-size="30" font-weight="800">Rp 8.740.000</text>
</svg>
